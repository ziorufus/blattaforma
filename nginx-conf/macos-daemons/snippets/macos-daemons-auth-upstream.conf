# Da personalizzare per ogni macchina: sostituire "mac-mini-195" con lo
# slug della macchina così come registrato nel modulo macos-daemons
# (tabella DaemonMachine, colonna slug). Lo stesso valore usato per il
# modulo ollama va bene, ma è un campo indipendente.
proxy_pass https://blattaforma.matita.net/api/modules/macos-daemons/check;
proxy_set_header Code mac-mini-195;
proxy_ssl_name blattaforma.matita.net;
