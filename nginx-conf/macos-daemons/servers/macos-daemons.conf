js_import macos_daemons_guard from macos_daemons_guard.js;

# Local helper service (see helpers/macos-daemons/helper/helper_service.py),
# bound to loopback only, runs as the same non-root user as this nginx.
upstream macos_daemons_helper {
    server 127.0.0.1:8765;
}

server {
    listen 11437;
    listen [::]:11437;

    server_name _;

    client_max_body_size 8k;

    auth_request /_macos_daemons_auth_check;

    location = /_macos_daemons_auth_check {
        internal;

        include snippets/macos-daemons-auth-upstream.conf;

        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Authorization $http_authorization;

        proxy_ssl_server_name on;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location = /start {
        js_access macos_daemons_guard.check;

        proxy_pass http://macos_daemons_helper/start;
        include snippets/macos-daemons-proxy.conf;
    }

    location = /stop {
        js_access macos_daemons_guard.check;

        proxy_pass http://macos_daemons_helper/stop;
        include snippets/macos-daemons-proxy.conf;
    }

    location = /enable {
        js_access macos_daemons_guard.check;

        proxy_pass http://macos_daemons_helper/enable;
        include snippets/macos-daemons-proxy.conf;
    }

    location = /disable {
        js_access macos_daemons_guard.check;

        proxy_pass http://macos_daemons_helper/disable;
        include snippets/macos-daemons-proxy.conf;
    }

    location = /status {
        js_access macos_daemons_guard.check;

        proxy_pass http://macos_daemons_helper/status;
        include snippets/macos-daemons-proxy.conf;
    }

    location / {
        return 403;
    }
}
