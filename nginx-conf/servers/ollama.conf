map_hash_bucket_size 128;
js_import ollama_guard from ollama_guard.js;

js_var $ollama_request_body "";

js_var $ollama_auth_mode "token";
js_var $ollama_model "";
js_var $ollama_num_ctx "";

server {
    listen 11435;
    listen [::]:11435;

    server_name _;

    client_max_body_size 100m;

    auth_request /_ollama_auth_check;

    location = /_ollama_auth_check {
        internal;

        include snippets/ollama-auth-upstream.conf;

        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Authorization $http_authorization;

        proxy_set_header X-Ollama-Auth-Mode $ollama_auth_mode;
        proxy_set_header X-Ollama-Model $ollama_model;
        proxy_set_header X-Ollama-Num-Ctx $ollama_num_ctx;

        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_server_name on;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location = /api/generate {
        auth_request off;

        js_access ollama_guard.check;

        proxy_pass http://127.0.0.1:11434;
        proxy_set_body $ollama_request_body;
        include snippets/ollama-proxy.conf;
    }

    location = /api/chat {
        auth_request off;

        js_access ollama_guard.check;

        proxy_pass http://127.0.0.1:11434;
        proxy_set_body $ollama_request_body;
        include snippets/ollama-proxy.conf;
    }

    location = /api/embed {
        proxy_pass http://127.0.0.1:11434;
        include snippets/ollama-proxy.conf;
    }

    location = /api/embeddings {
        proxy_pass http://127.0.0.1:11434;
        include snippets/ollama-proxy.conf;
    }

    location = /api/tags {
        proxy_pass http://127.0.0.1:11434;
        include snippets/ollama-proxy.conf;
    }

    location = /api/ps {
        proxy_pass http://127.0.0.1:11434;
        include snippets/ollama-proxy.conf;
    }

    location = /api/show {
        proxy_pass http://127.0.0.1:11434;
        include snippets/ollama-proxy.conf;
    }

    # Needed by the platform's "load model" flow: it creates a lightweight
    # derived model that bakes num_ctx into the Modelfile so the requested
    # context also sticks on the OpenAI-compatible endpoint. `from` always
    # references a model already present locally, so this never pulls.
    location = /api/create {
        proxy_pass http://127.0.0.1:11434;
        include snippets/ollama-proxy.conf;
    }

    location = /api/version {
        auth_request off;

        proxy_pass http://127.0.0.1:11434;
        include snippets/ollama-proxy.conf;
    }

    location = /v1/chat/completions {
        auth_request off;

        js_access ollama_guard.check;

        proxy_pass http://127.0.0.1:11434;
        proxy_set_body $ollama_request_body;
        include snippets/ollama-proxy.conf;
    }

    location = /v1/completions {
        auth_request off;

        js_access ollama_guard.check;

        proxy_pass http://127.0.0.1:11434;
        proxy_set_body $ollama_request_body;
        include snippets/ollama-proxy.conf;
    }

    location = /v1/embeddings {
        proxy_pass http://127.0.0.1:11434;
        include snippets/ollama-proxy.conf;
    }

    location = /v1/models {
        proxy_pass http://127.0.0.1:11434;
        include snippets/ollama-proxy.conf;
    }

    location = /v1/responses {
        auth_request off;

        js_access ollama_guard.check;

        proxy_pass http://127.0.0.1:11434;
        proxy_set_body $ollama_request_body;
        include snippets/ollama-proxy.conf;
    }

    location / {
        return 403;
    }
}
